<h1>Angular Reactive Form</h1>
<form [formGroup]="userForm">
  <input type="text" placeholder="Enter username" formControlName="username" />
  @if (getUsername?.invalid) {
    <p style="color: red">Username must be of 3 charactes</p>
  }
  <input type="text" placeholder="Enter password" formControlName="password" />
  @if (getPassword?.invalid) {
    <p style="color: red">Password must be of 8 charactes</p>
  }
</form>
