<h1>Angular Template Form</h1>
<form #f="ngForm">
  <input
    type="text"
    name="username"
    placeholder="Enter username"
    minlength="6"
    #username="ngModel"
    ngModel
  />
  <p *ngIf="username.invalid" style="color: red">Username must be of 6 characters</p>
  <p *ngIf="f.invalid" style="color: blue">Check all field properly</p>
</form>
